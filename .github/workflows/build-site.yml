name: 2. Build HTML site

# Generates the Astro project from a content branch's `markdown/` and commits
# it back to that branch as `site/`.
#
# Separate from the sync so the two halves fail independently: a converter
# problem and a site-generation problem have different causes and different
# fixes, and folding them into one job makes the markdown hostage to the
# site building.
#
# Lives on `main` with the convert workflow. A `push`-triggered version is not
# possible without copying this file onto every content branch — GitHub reads
# workflows from the branch that was pushed — so it takes the branch as an
# input instead.
#
# It runs the full build: `astro build` plus the Pagefind search index, and
# commits `site/dist` — the built HTML is what GitHub Pages will publish, so
# it is tracked rather than treated as a throwaway artefact.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Content branch to build (e.g. enterprise-4.22)"
        required: true
        default: "enterprise-4.22"

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with sync.yml, keyed on the same branch: both workflows push to it,
# and two pushes racing would fail on a stale ref.
concurrency:
  group: branch-${{ github.event.inputs.branch }}
  cancel-in-progress: false

env:
  DOGSBAY_VERSION: beta
  BRANCH: ${{ github.event.inputs.branch }}
  # ROUTABLE pages, which is far fewer than the markdown file count: the
  # config excludes _attributes/modules/snippets/includes from routes and
  # takes routables from nav, so ~11,800 .md yield ~1,800 .astro. The
  # existing openshift-docs-dogsbay builder emits 1,770 on main and this
  # corpus has 1,796 pages carrying frontmatter.
  #
  # This was 2000, copied from the sync's markdown threshold, which would
  # have failed every single run.
  MIN_PAGES: "1000"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the content branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Verify the branch carries converted markdown
        run: |
          set -euo pipefail
          if [ ! -d markdown ]; then
            echo "::error::no markdown/ on '$BRANCH' — run the sync workflow first"
            exit 1
          fi
          if [ ! -f dogsbay.config.yml ]; then
            echo "::error::no dogsbay.config.yml on '$BRANCH' — run workflow 1 first"
            exit 1
          fi
          # `dogsbay site build` refuses to run without a scaffold, checking
          # for <output>/package.json. Workflow 1 seeds it. Checked here so
          # the failure names the cause instead of surfacing as a bare
          # "no scaffold found" four steps later.
          if [ ! -f site/package.json ]; then
            echo "::error::no Astro scaffold at site/ on '$BRANCH' — re-run workflow 1, which seeds it"
            exit 1
          fi
          echo "markdown/: $(find markdown -name '*.md' | wc -l) file(s)"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dogsbay CLI
        run: npm install -g "dogsbay@${DOGSBAY_VERSION}"

      - name: Record the exact toolchain
        id: tools
        run: echo "cli=$(dogsbay --version)" >> "$GITHUB_OUTPUT"

      # Wipe the previously-committed page tree first. A stale baseline
      # survives the checkout, and pages whose source was deleted upstream
      # would otherwise persist in site/ forever — the same reasoning as the
      # sync's `rm -rf markdown`, applied one stage later.
      - name: Clear the previous page tree
        run: rm -rf site/src/pages

      # `dogsbay.config.yml` already points sources at ./markdown and output
      # at ./site, so the build needs no arguments beyond the root.
      - name: Generate the Astro project
        run: dogsbay site build .

      - name: Refuse an implausibly small site
        id: count
        run: |
          set -euo pipefail
          n=$(find site/src/pages -name '*.astro' | wc -l)
          echo "pages=$n" >> "$GITHUB_OUTPUT"
          echo "generated $n .astro page(s)"
          if [ "$n" -lt "$MIN_PAGES" ]; then
            echo "::error::only $n pages (< $MIN_PAGES) — refusing to commit what looks like an empty site"
            exit 1
          fi

      # Generating .astro files does not prove they compile. This is the
      # step that does, and it is cheap: measured on the equivalent
      # openshift-docs-dogsbay build, `astro build` over ~1,800 routable
      # pages takes ~90s, with the whole pipeline at 5m32s.
      #
      # The scaffold emits astro ^7.0.4, so no build-at-scale patch is
      # needed here — openshift-docs-dogsbay still runs an apply-astro7.mjs
      # written when the scaffold emitted Astro 6.
      #
      # dist/ is COMMITTED: it is what Pages will serve.
      # WORKAROUND, remove once the CLI is republished.
      #
      # dogsbay@0.2.0-beta.93 pins @dogsbay/format-astro EXACTLY at
      # 0.2.0-beta.93, whose scaffold still writes `overrides: { vite: "^7" }`
      # — an Astro 6-era guard. `astro: ^7.0.4` resolves to astro 7.2.x, which
      # pairs with vite 8, so forcing vite 7 breaks the build with:
      #
      #   rollupOptions.input should not be an html file when building for SSR
      #
      # format-astro@0.2.0-beta.100 already drops the override, but nothing
      # installs it: the CLI's exact pin wins over format-astro's own `beta`
      # tag. Publishing dogsbay >= beta.100 is the real fix.
      #
      # Conditional, so this step becomes a no-op the moment that happens
      # rather than silently masking a future deliberate override.
      - name: Drop the stale vite override
        working-directory: site
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const p = "package.json";
            const j = JSON.parse(fs.readFileSync(p, "utf8"));
            if (j.overrides && j.overrides.vite) {
              const was = j.overrides.vite;
              delete j.overrides.vite;
              if (Object.keys(j.overrides).length === 0) delete j.overrides;
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
              console.log(`removed stale overrides.vite (${was})`);
            } else {
              console.log("no vite override — CLI is current, step is a no-op");
            }
          '

      - name: Install Astro project deps
        working-directory: site
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Record the resolved Astro and Vite versions
        working-directory: site
        run: |
          set -euo pipefail
          for p in astro vite; do
            v=$(node -p "require('./node_modules/$p/package.json').version" 2>/dev/null || echo "?")
            echo "  $p $v"
          done

      - name: Verify the site compiles (astro build)
        working-directory: site
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx astro build

      # Without an index the published site's search box finds nothing.
      # Part of the build, not an extra: dist is only complete with it.
      - name: Build the Pagefind search index
        working-directory: site
        run: npx -y pagefind --site dist

      # GitHub Pages runs Jekyll unless told not to, and Jekyll refuses to
      # serve directories beginning with an underscore — which is every
      # Astro build asset (`_astro/`) and every converted image
      # (`_assets/`). Without this the site publishes with no CSS, no JS
      # and no images.
      - name: Add .nojekyll
        working-directory: site
        run: touch dist/.nojekyll

      - name: Report built output
        id: built
        working-directory: site
        run: |
          set -euo pipefail
          h=$(find dist -name '*.html' | wc -l)
          b=$(find dist -type f -printf '%s\n' | awk '{s+=$1} END{printf "%.1f", s/1048576}')
          echo "html=$h" >> "$GITHUB_OUTPUT"
          echo "mb=$b"   >> "$GITHUB_OUTPUT"
          echo "built $h HTML page(s), ${b} MB total"

      - name: Commit the generated site
        env:
          PAGES: ${{ steps.count.outputs.pages }}
          CLI: ${{ steps.tools.outputs.cli }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Explicit path. site/node_modules and site/.astro are ignored;
          # the generated project AND the built dist are both tracked.
          git add site

          if git diff --cached --quiet; then
            echo "site/ unchanged since the last build — nothing to commit"
            exit 0
          fi

          git commit -m "site($BRANCH): generate Astro project — $PAGES pages" \
                     -m "From markdown/ at $(git rev-parse --short HEAD), dogsbay $CLI"
          git push origin "HEAD:$BRANCH"

      # Uploaded from the COMMITTED dist, so what Pages serves is exactly
      # what is in the branch — no second build, no chance of the published
      # site and the tracked bytes disagreeing.
      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
          retention-days: 1

      - name: Summary
        if: always()
        env:
          PAGES: ${{ steps.count.outputs.pages }}
          HTML: ${{ steps.built.outputs.html }}
          MB: ${{ steps.built.outputs.mb }}
        run: |
          {
            echo "### Site build \`$BRANCH\`"
            echo ""
            echo "- generated pages: ${PAGES:-?}"
            echo "- built HTML: ${HTML:-?} (${MB:-?} MB, committed to \`dist/\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing is a SEPARATE job so it can be gated. The site is PUBLIC even
  # though the repo is private: GitHub Pro does not support private Pages
  # ("Current plan does not support private GitHub Pages", HTTP 422), so
  # anything deployed here is on the open internet.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The artefact is only needed between the two jobs. Left alone it
      # accumulates against Actions storage — this repo's dist is ~200 MB a
      # run, and openshift-docs-dogsbay became the account's top storage
      # consumer exactly this way.
      - name: Free the Pages artefact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
          done
